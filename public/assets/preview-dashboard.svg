<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="500" rx="16" fill="#090d16" />
  <rect x="20" y="24" width="36" height="36" rx="10" fill="url(#primaryGrad)" />
  <text x="68" y="48" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">TutoLink</text>
  <text x="68" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">Institute OS</text>

  <!-- Sidebar Nav items -->
  <rect x="16" y="90" width="168" height="38" rx="8" fill="url(#primaryGrad)" opacity="0.2" />
  <rect x="16" y="90" width="4" height="38" rx="2" fill="#818cf8" />
  <text x="50" y="114" fill="#818cf8" font-family="sans-serif" font-weight="600" font-size="13">📊 Overview</text>
  <text x="50" y="154" fill="#94a3b8" font-family="sans-serif" font-size="13">👥 Students (450)</text>
  <text x="50" y="194" fill="#94a3b8" font-family="sans-serif" font-size="13">📚 Batches &amp; Courses</text>
  <text x="50" y="234" fill="#94a3b8" font-family="sans-serif" font-size="13">🎥 Live Classes</text>
  <text x="50" y="274" fill="#94a3b8" font-family="sans-serif" font-size="13">📝 Exam &amp; Tests</text>
  <text x="50" y="314" fill="#94a3b8" font-family="sans-serif" font-size="13">💬 Doubts &amp; Chat</text>
  <text x="50" y="354" fill="#94a3b8" font-family="sans-serif" font-size="13">💰 Fee Management</text>

  <!-- Header bar -->
  <rect x="220" y="20" width="560" height="50" rx="12" fill="url(#cardGrad)" stroke="#334155" />
  <text x="240" y="50" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">Verma Science Institute - Admin Portal</text>
  <rect x="660" y="30" width="100" height="30" rx="15" fill="#22c55e" opacity="0.2" />
  <circle cx="675" cy="45" r="4" fill="#22c55e" />
  <text x="685" y="49" fill="#4ade80" font-family="sans-serif" font-weight="600" font-size="12">Live Active</text>

  <!-- Metric Cards -->
  <!-- Card 1 -->
  <rect x="220" y="85" width="170" height="95" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.3" />
  <text x="236" y="112" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Enrolled</text>
  <text x="236" y="145" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">450 Students</text>
  <text x="236" y="165" fill="#4ade80" font-family="sans-serif" font-size="11">↑ +18% this month</text>

  <!-- Card 2 -->
  <rect x="405" y="85" width="170" height="95" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.3" />
  <text x="421" y="112" fill="#94a3b8" font-family="sans-serif" font-size="12">Tests Conducted</text>
  <text x="421" y="145" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">128 Papers</text>
  <text x="421" y="165" fill="#818cf8" font-family="sans-serif" font-size="11">Average Score: 78%</text>

  <!-- Card 3 -->
  <rect x="590" y="85" width="190" height="95" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" />
  <text x="606" y="112" fill="#94a3b8" font-family="sans-serif" font-size="12">Fee Collected</text>
  <text x="606" y="145" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">₹4,85,000</text>
  <text x="606" y="165" fill="#4ade80" font-family="sans-serif" font-size="11">✓ 94% On-time</text>

  <!-- Main Chart Area -->
  <rect x="220" y="195" width="355" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" />
  <text x="240" y="225" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Student Attendance &amp; Test Participation</text>
  
  <!-- Wave Graph path -->
  <path d="M 240 380 Q 290 320, 340 350 T 440 280 T 540 250" fill="none" stroke="url(#accentCyan)" stroke-width="4" />
  <path d="M 240 380 Q 290 320, 340 350 T 440 280 T 540 250 L 540 430 L 240 430 Z" fill="url(#accentCyan)" opacity="0.1" />
  <circle cx="540" cy="250" r="6" fill="#38bdf8" />

  <!-- Right Side Live Activity List -->
  <rect x="590" y="195" width="190" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" />
  <text x="606" y="225" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Live Activity</text>
  
  <circle cx="616" cy="260" r="12" fill="#3b82f6" opacity="0.3" />
  <text x="636" y="258" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">JEE Physics Test Live</text>
  <text x="636" y="272" fill="#94a3b8" font-family="sans-serif" font-size="10">84 students attempting</text>

  <circle cx="616" cy="310" r="12" fill="#10b981" opacity="0.3" />
  <text x="636" y="308" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Fee Received: ₹15,000</text>
  <text x="636" y="322" fill="#94a3b8" font-family="sans-serif" font-size="10">From Rahul Sharma</text>

  <circle cx="616" cy="360" r="12" fill="#a855f7" opacity="0.3" />
  <text x="636" y="358" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">New Lead Enquiry</text>
  <text x="636" y="372" fill="#94a3b8" font-family="sans-serif" font-size="10">Class 11 NEET Batch</text>
</svg>
