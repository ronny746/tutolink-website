<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Mobile Phone Mockup Center -->
  <rect x="250" y="20" width="300" height="460" rx="30" fill="#1e293b" stroke="#4f46e5" stroke-width="4" />
  <rect x="340" y="32" width="120" height="18" rx="9" fill="#0f172a" />
  
  <!-- Phone Screen Content -->
  <rect x="265" y="60" width="270" height="400" rx="16" fill="#0f172a" />
  
  <!-- Header App Bar -->
  <rect x="265" y="60" width="270" height="55" fill="#1e1b4b" />
  <text x="280" y="86" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Parent Portal - TutoLink</text>
  <text x="280" y="102" fill="#a5b4fc" font-family="sans-serif" font-size="10">Student: Aarav Sharma (Class 10)</text>

  <!-- Performance Card -->
  <rect x="280" y="125" width="240" height="90" rx="10" fill="#1e293b" />
  <text x="295" y="145" fill="#94a3b8" font-size="11">Monthly Attendance</text>
  <text x="295" y="170" fill="#4ade80" font-family="sans-serif" font-weight="bold" font-size="20">96.5% Present</text>
  <text x="295" y="195" fill="#cbd5e1" font-size="10">24/25 Classes Attended</text>

  <!-- Recent Test Marks -->
  <rect x="280" y="225" width="240" height="110" rx="10" fill="#1e293b" />
  <text x="295" y="245" fill="#94a3b8" font-size="11">Latest Test Result (Science Mock 3)</text>
  <text x="295" y="275" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="22">92 / 100</text>
  <text x="295" y="295" fill="#a855f7" font-size="11" font-weight="bold">Rank: 2nd out of 85 students</text>
  <rect x="295" y="305" width="210" height="12" rx="6" fill="#334155" />
  <rect x="295" y="305" width="190" height="12" rx="6" fill="#3b82f6" />

  <!-- Fee Due Notice -->
  <rect x="280" y="345" width="240" height="95" rx="10" fill="#311b92" stroke="#6366f1" />
  <text x="295" y="365" fill="#fbbf24" font-weight="bold" font-size="11">💳 October Fee Status</text>
  <text x="295" y="388" fill="#ffffff" font-size="12">Amount Due: ₹3,500</text>
  <rect x="295" y="400" width="120" height="26" rx="6" fill="#10b981" />
  <text x="315" y="417" fill="#ffffff" font-weight="bold" font-size="11">Pay Now (UPI)</text>

  <!-- WhatsApp Notification Graphic Left -->
  <rect x="30" y="140" width="190" height="120" rx="12" fill="#064e3b" stroke="#10b981" />
  <text x="45" y="165" fill="#34d399" font-weight="bold" font-size="12">💬 WhatsApp Alert</text>
  <text x="45" y="190" fill="#ffffff" font-size="10">Respected Parent, Aarav scored</text>
  <text x="45" y="208" fill="#ffffff" font-size="10">92/100 in Science Test.</text>
  <text x="45" y="226" fill="#ffffff" font-size="10">View full report card on App.</text>

  <!-- Auto Receipt Right -->
  <rect x="580" y="140" width="190" height="120" rx="12" fill="#1e1b4b" stroke="#818cf8" />
  <text x="595" y="165" fill="#a855f7" font-weight="bold" font-size="12">🧾 Digital Fee Receipt</text>
  <text x="595" y="190" fill="#ffffff" font-size="10">Receipt #TL-8492</text>
  <text x="595" y="208" fill="#4ade80" font-size="11" font-weight="bold">PAID: ₹3,500 via GPay</text>
  <text x="595" y="226" fill="#94a3b8" font-size="10">Instant SMS sent to parent</text>
</svg>
