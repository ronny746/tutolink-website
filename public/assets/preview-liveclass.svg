<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="800" height="500" rx="16" fill="url(#bgLive)" stroke="#374151" stroke-width="1.5"/>

  <!-- Live Video Screen -->
  <rect x="20" y="20" width="540" height="380" rx="12" fill="url(#screenGrad)" stroke="#6366f1" stroke-opacity="0.5" />
  
  <!-- Video Content Mockup (Teacher & Digital Board) -->
  <rect x="40" y="40" width="300" height="180" rx="8" fill="#0f172a" opacity="0.6" />
  <text x="60" y="80" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">F = m × a  (Newton's 2nd Law)</text>
  <text x="60" y="110" fill="#a5b4fc" font-family="sans-serif" font-size="13">Acceleration = (v - u) / t</text>
  <line x1="60" y1="130" x2="300" y2="130" stroke="#6366f1" stroke-width="2" stroke-dasharray="4" />

  <!-- Teacher Avatar Circle -->
  <circle cx="480" cy="140" r="50" fill="#4f46e5" />
  <text x="455" y="146" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Teacher</text>
  <rect x="420" y="200" width="120" height="24" rx="12" fill="#ef4444" />
  <circle cx="435" cy="212" r="4" fill="#ffffff" />
  <text x="445" y="216" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">● LIVE STREAM</text>

  <!-- Video Control Bar -->
  <rect x="20" y="410" width="540" height="70" rx="12" fill="#1e293b" />
  <circle cx="60" cy="445" r="18" fill="#ef4444" />
  <text x="54" y="450" fill="#ffffff" font-size="12">🎙️</text>
  <circle cx="105" cy="445" r="18" fill="#3b82f6" />
  <text x="99" y="450" fill="#ffffff" font-size="12">📹</text>
  <circle cx="150" cy="445" r="18" fill="#10b981" />
  <text x="143" y="450" fill="#ffffff" font-size="12">✋</text>
  <text x="190" y="450" fill="#94a3b8" font-family="sans-serif" font-size="13">Attendance: 142/150 Present (94.6%)</text>

  <!-- Chat & Q&A Sidebar -->
  <rect x="580" y="20" width="200" height="460" rx="12" fill="#111827" stroke="#374151" />
  <rect x="580" y="20" width="200" height="45" rx="12" fill="#1f2937" />
  <text x="600" y="48" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Live Chat &amp; Doubts</text>

  <!-- Chat Messages -->
  <rect x="590" y="80" width="180" height="48" rx="8" fill="#1e293b" />
  <text x="600" y="98" fill="#818cf8" font-family="sans-serif" font-weight="bold" font-size="11">Rohan (Class 11)</text>
  <text x="600" y="116" fill="#e2e8f0" font-family="sans-serif" font-size="11">Sir, vector component repeat krdo</text>

  <rect x="590" y="140" width="180" height="48" rx="8" fill="#1e293b" />
  <text x="600" y="158" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">Priya Verma</text>
  <text x="600" y="176" fill="#e2e8f0" font-family="sans-serif" font-size="11">Got it sir! Formula clear hai.</text>

  <rect x="590" y="200" width="180" height="60" rx="8" fill="#312e81" stroke="#6366f1" />
  <text x="600" y="218" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="11">📌 Teacher Notice</text>
  <text x="600" y="234" fill="#ffffff" font-family="sans-serif" font-size="10">DPP #4 link active on portal!</text>
</svg>
